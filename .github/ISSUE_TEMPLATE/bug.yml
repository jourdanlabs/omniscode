name: Bug report
description: Reproduce a non-security defect with synthetic data.
title: "[bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Do not include credentials, private ledgers, receipts, keys, customer data, or undisclosed vulnerabilities.
  - type: input
    id: identity
    attributes:
      label: Commit and tree
      description: Output of `git rev-parse HEAD` and `git rev-parse HEAD^{tree}`.
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Linux
        - macOS
        - Windows (inherited compatibility only)
        - Other
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Synthetic reproduction
      description: Exact command, fixture, output, and exit status.
    validations:
      required: true
  - type: textarea
    id: effects
    attributes:
      label: Network and filesystem effects
      description: State what was instrumented and what changed.
    validations:
      required: true
