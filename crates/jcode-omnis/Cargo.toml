[package]
name = "jcode-omnis"
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/jourdanlabs/omniscode"
homepage = "https://github.com/jourdanlabs/omniscode"
publish = false
description = "Experimental source kernel for separately activated OMNIS checkpoint primitives"
autobins = false
autoexamples = false
autobenches = false

[dependencies]
anyhow = "1"
hex = "0.4"
libc = "0.2"
ring = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"
