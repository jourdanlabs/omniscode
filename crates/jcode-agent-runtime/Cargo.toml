[package]
name = "jcode-agent-runtime"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"
repository = "https://github.com/jourdanlabs/omniscode"
homepage = "https://github.com/jourdanlabs/omniscode"

[lib]
name = "jcode_agent_runtime"
path = "src/lib.rs"

[dependencies]
thiserror = "1"
tokio = { version = "1", features = ["sync"] }

[dev-dependencies]
tokio = { version = "1", features = ["sync", "rt-multi-thread", "time", "macros"] }
