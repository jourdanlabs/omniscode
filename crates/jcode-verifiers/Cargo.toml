[package]
name = "jcode-verifiers"
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/jourdanlabs/omniscode"
homepage = "https://github.com/jourdanlabs/omniscode"
publish = false
description = "OMNIS CODE Claim Ledger stage-3 verifiers — deterministic tools only, no model"

[lib]
name = "jcode_verifiers"
path = "src/lib.rs"

# 🔴 LOAD-BEARING: this crate MUST NOT depend on any LLM / provider crate.
# Enforced by tests/no_provider_deps.rs and reviewed on every gate.
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
