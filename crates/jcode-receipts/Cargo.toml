[package]
name = "jcode-receipts"
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/jourdanlabs/omniscode"
homepage = "https://github.com/jourdanlabs/omniscode"
publish = false
description = "OMNIS action receipts — agent mutations append to the hash-chained ledger (redacted argv, fail-closed)"

[lib]
name = "jcode_receipts"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
hex = "0.4"
jcode-base = { path = "../jcode-base", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"
