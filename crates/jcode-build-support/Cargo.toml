[package]
name = "jcode-build-support"
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/jourdanlabs/omniscode"
homepage = "https://github.com/jourdanlabs/omniscode"
publish = false
autoexamples = false
autobenches = false

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
jcode-core = { path = "../jcode-core" }
jcode-selfdev-types = { path = "../jcode-selfdev-types" }
jcode-storage = { path = "../jcode-storage" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"

[dev-dependencies]
tempfile = "3"
