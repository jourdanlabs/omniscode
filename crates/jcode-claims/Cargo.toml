[package]
name = "jcode-claims"
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/jourdanlabs/omniscode"
homepage = "https://github.com/jourdanlabs/omniscode"
publish = false
description = "OMNIS CODE Claim Ledger — typed claims, frozen verdicts, short-circuit typing, claim receipts"

[lib]
name = "jcode_claims"
path = "src/lib.rs"

[dependencies]
jcode-verifiers = { path = "../jcode-verifiers" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
thiserror = "2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }

[dev-dependencies]
tempfile = "3"
