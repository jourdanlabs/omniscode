[package]
name = "omnis-key-cli"
version = "0.1.0"
edition = "2024"
description = "Offline local-integrity command surface for OMNIS KEY"
license = "MIT"
repository = "https://github.com/jourdanlabs/omniscode"
homepage = "https://github.com/jourdanlabs/omniscode"
publish = false
autobins = false
autoexamples = false
autobenches = false

[lib]
name = "omnis_key_cli"
path = "src/lib.rs"

[[bin]]
name = "omnis-key"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
jcode-base = { path = "../jcode-base", default-features = false }
jcode-build-meta = { path = "../jcode-build-meta" }
jcode-omnis = { path = "../jcode-omnis" }
jcode-claims = { path = "../jcode-claims" }
jcode-receipts = { path = "../jcode-receipts" }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
signal-hook = "0.3"
tempfile = "3"
