[package]
name = "jcode-import-core"
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/jourdanlabs/omniscode"
homepage = "https://github.com/jourdanlabs/omniscode"
publish = false

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"
